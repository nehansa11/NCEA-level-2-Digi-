<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#75c4cb">
  <title>Map Aotearoa Support Near Me</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="map">
  <header id="app-header"></header>
  <main class="app-main">
    <div id="privacy-banner"></div>

    <p id="location-status" class="location-status-inline" aria-live="polite"></p>

    <div>
      <div class="map-filter-row">
        <button id="scroll-to-list" type="button" class="list-filter-button">
          <img class="icon" src="assets/icons/list.svg" alt="">
          <span data-i18n="map.list">List</span>
        </button>
        <div id="map-category-filters" class="chip-row"></div>
      </div>

      <div id="map" class="map-canvas">
        <div class="map-placeholder" data-i18n="map.loading">Loading map…</div>
      </div>
    </div>

    <div id="map-results-div" class="div-block">
      <div class="result-count-row">
        <span id="map-result-count" class="result-count"></span>
      </div>
      <div id="map-service-list" class="service-list" aria-live="polite"></div>
    </div>
  </main>
  <nav id="bottom-navigation"></nav>
  <script type="module" src="assets/js/map.js"></script>
</body>
</html>
